name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run build

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd dist
          python3 -c "open('README.md','w').write('---\ntitle: CORDA Democratic AI-Readiness Index\nemoji: \"\xf0\x9f\x93\x8a\"\ncolorFrom: blue\ncolorTo: indigo\nsdk: static\npinned: false\n---\n')"
          pip install -q -U huggingface_hub
          python3 -c "
          from huggingface_hub import HfApi
          api = HfApi()
          api.upload_folder(
              folder_path='.',
              repo_id='newlivehung/corda-democracy',
              repo_type='space',
              commit_message='Deploy from GitHub',
          )
          "
